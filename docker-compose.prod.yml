# =============================================================================
# IOC ESG Municipal — Docker Compose PRODUÇÃO
# =============================================================================
# USO:
#   docker compose -f docker-compose.prod.yml up -d
#
# PRÉ-REQUISITOS:
#   - Imagem construída: docker build -t ioc-esg-municipal:latest .
#   - Arquivo .env preenchido a partir de .env.production.example
#   - Variável IMAGE_TAG definida (padrão: latest)
#
# DIFERENÇAS vs docker-compose.yml (dev):
#   - Sem Adminer
#   - Redis com appendonly + senha obrigatória
#   - API usa imagem pré-construída (sem bind mount de código)
#   - Resource limits em todos os serviços
#   - Logging json-file com rotação
#   - restart: unless-stopped em todos
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: ioc_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ioc_redis_prod
    restart: unless-stopped
    # appendonly garante persistência: dados sobrevivem a restart
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  api:
    # IMAGE_TAG deve ser o commit SHA do deploy (ex: IMAGE_TAG=abc1234)
    image: ${REGISTRY:-ghcr.io/seu-org}/ioc-esg-municipal:${IMAGE_TAG:-latest}
    container_name: ioc_api_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # APIs governamentais
      IBGE_API_URL: ${IBGE_API_URL:-https://servicodados.ibge.gov.br/api/v1}
      SICONFI_API_URL: ${SICONFI_API_URL:-https://api.siconfi.tesouro.gov.br/v1}
      DATASUS_API_URL: ${DATASUS_API_URL:-https://datasus.saude.gov.br}
      INPE_API_URL: ${INPE_API_URL:-https://terrabrasilis.dpi.inpe.br/api/v1}
      PNCP_API_URL: ${PNCP_API_URL:-https://pncp.gov.br/api/pncp/v1}
      # Agentes
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-30000}
      AGENT_RETRY_COUNT: ${AGENT_RETRY_COUNT:-3}
      AGENT_RETRY_DELAY: ${AGENT_RETRY_DELAY:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ioc_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend:
    driver: bridge
