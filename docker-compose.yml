version: "3.8"

# =============================================================================
# IOC ESG Municipal — Docker Compose DESENVOLVIMENTO LOCAL
# =============================================================================
# USO:
#   docker compose up -d
#
# Inicia apenas PostgreSQL e Redis. O backend e frontend rodam localmente
# via pnpm dev (backend :3000 + frontend :5173).
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: ioc_postgres
    environment:
      POSTGRES_USER: ioc
      POSTGRES_PASSWORD: ioc_dev_2026
      POSTGRES_DB: ioc_esg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioc -d ioc_esg"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ioc_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
