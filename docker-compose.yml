# =============================================================================
# IOC ESG Municipal — Docker Compose DESENVOLVIMENTO
# =============================================================================
# USO:
#   docker compose up -d          # sobe tudo (postgres + redis + backend + frontend)
#   docker compose up --build     # rebuild + logs (após mudar Dockerfile.dev ou deps)
#
# Tudo roda em container. Hot reload via bind-mounts:
#   - backend: tsx watch (recarrega ao editar backend/ shared/ prisma/)
#   - frontend: vite HMR (recarrega ao editar frontend/ shared/)
#
# Para subir apenas infra (postgres+redis) e rodar backend/frontend no host:
#   docker compose up -d postgres redis && pnpm dev
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: ioc_postgres
    environment:
      POSTGRES_USER: ioc
      POSTGRES_PASSWORD: ioc_dev_2026
      POSTGRES_DB: ioc_esg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioc -d ioc_esg"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ioc_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ioc_backend
    command: sh -c "npx prisma migrate deploy && pnpm dev:backend"
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./prisma:/app/prisma
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://ioc:ioc_dev_2026@postgres:5432/ioc_esg?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-docker-only
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ioc_frontend
    command: sh -c "cd frontend && pnpm exec vite --host"
    volumes:
      # Source dirs — bind-mount para HMR (editar no host → Vite recarrega)
      - ./frontend/src:/app/frontend/src
      - ./frontend/pages:/app/frontend/pages
      - ./frontend/components:/app/frontend/components
      - ./frontend/hooks:/app/frontend/hooks
      - ./frontend/lib:/app/frontend/lib
      # Config files — bind-mount para mudanças de config sem rebuild
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tailwind.config.js:/app/frontend/tailwind.config.js
      - ./frontend/postcss.config.js:/app/frontend/postcss.config.js
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      # Shared types (usado por imports @shared/)
      - ./shared:/app/shared
      # Preservar node_modules da imagem (binários Linux)
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
