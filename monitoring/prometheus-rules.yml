groups:
  - name: ioc-api-alerts
    rules:
      - alert: HighErrorRate
        expr: >
          sum(rate(http_errors_total{status_code=~"5.."}[5m]))
          /
          sum(rate(http_request_duration_ms_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erro 5xx acima de 5% nos últimos 5 minutos"

      - alert: SlowP95
        expr: >
          histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le))
          > 3000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 de latência acima de 3s por 5 minutos"

      - alert: ExternalApiDown
        expr: >
          sum by (source) (rate(outbound_api_duration_ms_count{success="false"}[5m]))
          > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API externa {{ $labels.source }} com mais de 10 falhas em 5min"

      - alert: CacheErrorRising
        expr: >
          rate(cache_operations_total{operation="ERROR"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Erros de cache Redis crescendo — verificar conexão"
